[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twelve-tone-suite"
version = "0.2.0"
description = "A desktop twelve-tone matrix and MusicXML composition tool"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
score = ["music21>=9.1,<10"]

[project.scripts]
twelve-tone = "twelve_tone.app:main"

[tool.setuptools.packages.find]
include = ["twelve_tone*"]
