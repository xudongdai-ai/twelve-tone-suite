name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install matrix-only package
        run: python -m pip install .
      - name: Test without score dependencies
        run: python -m unittest discover -s tests -v
      - name: Install score dependencies
        run: python -m pip install '.[score]'
      - name: Test MusicXML generation
        run: python -m unittest discover -s tests -v
